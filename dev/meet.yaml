# One document describing the whole process: the media server's own tables, plus
# the `meet` section this server reads. They cannot be unmarshalled together, so
# the section is lifted out first and the rest is handed over untouched.

# The media server's HTTP listener, kept on loopback. Browsers never reach it
# directly: signalling arrives at the port below and is forwarded here, so one
# port faces the network and it is ours.
port: 7880
bind_addresses: ["127.0.0.1"]

rtc:
  # A single UDP port rather than a range. Every track, screen shares included,
  # is multiplexed onto it, so a firewall needs one hole instead of ten
  # thousand. This is the one port that must be reachable besides the web one.
  udp_port: 7882
  # TCP fallback, for networks that drop UDP outright.
  tcp_port: 7881
  # False because everything here is local. Set it on a server with a public
  # address, or participants will be handed an address only the host can reach.
  use_external_ip: false

keys:
  # Development credentials. The media server verifies with these and this
  # server signs with them, so they are one secret rather than two. Generate a
  # real pair with `meet-live keygen` for anything reachable.
  APIdevelopment: development-secret-not-for-anything-reachable

logging:
  level: info

meet:
  listen: ":8080"
  database: "meet.db"

  # Served from disk while working on the client, so a rebuild shows up on
  # reload rather than needing the server recompiled. Unset in a deployment,
  # where the client inside the binary is used.
  web_root: "../web/dist"

  # Where the code running here can be read. Shown on the join page, because
  # this is under the AGPL and offering a program over a network obliges its
  # operator to offer the source to whoever is using it that way. Point it at a
  # changed copy if this one has been changed.
  source_url: "https://github.com/5t-RawBeRry/Tomoshibi"

  rooms:
    # Who may use a name nobody has used before. `anyone` is what an anonymous
    # meeting link means; `admins` refuses a fresh name unless the passphrase
    # sent with the join belongs to somebody under `admins` above. Either way a
    # name already in use stays open to everybody who has it.
    #
    # The starting value only. The management pages change this and cannot edit
    # a file, so it is kept in the store, adopted from here the first time the
    # server runs, and read from there afterwards.
    opened_by: anyone

    # How long a name stays used after the last time somebody joined it. Two
    # things at once, and they agree: a name was written down on first use and
    # nothing ever took one away, so the file grew for as long as anybody asked
    # for names — and a name nobody has spoken in a month is not a room in use.
    # Under `admins` this is therefore how long a room stays open unattended.
    # Zero keeps every name for ever, which is what this did before it existed.
    remember: 720h
